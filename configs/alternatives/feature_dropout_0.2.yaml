data:
  path: build/alternatives/continuous.h5mu
  views:
  - gexp
  - meth
  - crispr
  use_tissue: true
  use_mutations: true
model:
  type: mosa_vae
  output_dir: build/alternatives/feature_dropout_0.2/outputs
  joint_latent_dim: 8
  num_epochs: 1
  batch_size: 16
  accelerator: cpu
  devices: 1
  random_seed: 42
  views:
    gexp:
      hidden_layer_dims:
      - 16
      dropout_p: 0.2
    meth:
      hidden_layer_dims:
      - 16
      dropout_p: 0.2
    crispr:
      hidden_layer_dims:
      - 16
      dropout_p: 0.2
evaluation:
  test_size: 0.2
  n_folds: 3
